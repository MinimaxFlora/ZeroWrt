name: X86_64

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  Build:
    uses: ./.github/workflows/Build-Release.yml
    permissions:
      contents: write
      actions: write
    with:
      CONFIG_FILE: configs/x86_64.config
      FIRMWARE_TAG: X86_64
