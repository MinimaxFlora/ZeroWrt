name: Build ZeroWrt

on:
  workflow_dispatch:
    inputs:
      ip:
        description: "LAN IP (management address), e.g. 10.0.0.1"
        required: true
        type: string
        default: "10.0.0.1"
      wifi_name:
        description: "WiFi name prefix; -2.4G / -5G / -6G is appended automatically"
        required: true
        type: string
        default: "ZeroWrt"
      wifi_password:
        description: "WiFi password: 8-63 chars, letters/digits/!@#$%^&*()_+.:=?- only"
        required: true
        type: string
        default: "1234567890"
      device:
        description: "Device profile"
        required: true
        type: choice
        default: "ruijie_rg-x60-new"
        options:
          - ruijie_rg-x60-new
          - x86_64

permissions:
  contents: write

concurrency:
  group: zerowrt-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  BUILD_ROOT: /builder
  LEDE_DIR: /builder/lede
  ZEROWRT_DEVICE: ${{ github.event.inputs.device || 'ruijie_rg-x60-new' }}
  OTA_BASE_URL: "https://ota.kejizero.xyz"
  CCACHE_DIR: /builder/ccache

jobs:
  build:
    name: Compile ZeroWrt
    # Pin the image on purpose: ubuntu-latest migrates to Ubuntu 26 in
    # October 2026 and would swap the toolchain under an unchanged build.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ZEROWRT_REF: ${{ secrets.LEDE_REF || 'ruijie-rg-x60-new' }}

    steps:
      - name: Checkout ZeroWrt
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Show runner
        run: |
          python3 --version
          uname -a

      # Fast path: large runners already have enough space, so nothing is
      # deleted or merged. Small runners are cleaned up and merged with LVM.
      - name: Prepare build space
        run: |
          python3 scripts/zerowrt.py system free-disk \
            --build-dir "$BUILD_ROOT" \
            --swap-gb 4 \
            --reserve-gb 6 \
            --min-free-gb 50

      - name: Install build dependencies
        run: python3 scripts/zerowrt.py system install-deps

      - name: Install LLVM
        run: python3 scripts/zerowrt.py system install-llvm

      - name: Clone private LEDE source
        env:
          LEDE_REPO: ${{ secrets.LEDE_REPO }}
          LEDE_TOKEN: ${{ secrets.LEDE_TOKEN }}
          REF: ${{ secrets.LEDE_REF }}
        run: |
          python3 scripts/zerowrt.py source clone \
            --dest "$LEDE_DIR" \
            --ref "${REF:-ruijie-rg-x60-new}"

      - name: Update feeds
        run: python3 scripts/zerowrt.py source feeds --tree "$LEDE_DIR"

      - name: Apply core customisations
        env:
          ZEROWRT_IP: ${{ github.event.inputs.ip || '10.0.0.1' }}
          ZEROWRT_WIFI_NAME: ${{ github.event.inputs.wifi_name || 'ZeroWrt' }}
          ZEROWRT_WIFI_PASSWORD: ${{ github.event.inputs.wifi_password || '1234567890' }}
        run: |
          python3 scripts/zerowrt.py source customize \
            --tree "$LEDE_DIR" \
            --ip "$ZEROWRT_IP" \
            --wifi-name "$ZEROWRT_WIFI_NAME"

      - name: Add external packages and branding
        run: |
          python3 scripts/zerowrt.py packages add \
            --tree "$LEDE_DIR" \
            --assets "$GITHUB_WORKSPACE/assets"

      - name: Add luci-app-ota
        run: |
          git clone --depth 1 https://github.com/MinimaxFlora/luci-app-ota.git \
            "$LEDE_DIR/package/new/luci-app-ota"
          test -f "$LEDE_DIR/package/new/luci-app-ota/Makefile"

      - name: Generate .config
        run: |
          python3 scripts/zerowrt.py config generate \
            --tree "$LEDE_DIR" \
            --device "$ZEROWRT_DEVICE"

      - name: Embed OTA metadata
        run: |
          python3 "$LEDE_DIR/package/new/luci-app-ota/tools/embed_ota_meta.py" \
            --tree "$LEDE_DIR" \
            --info "$LEDE_DIR/.zerowrt-info.json" \
            --dist-name ZeroWrt \
            --api-url "$OTA_BASE_URL/ota.json" \
            --emit "$GITHUB_WORKSPACE/ota-meta.json"

      - name: Bind ccache directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ccache" /builder/ccache
          sudo mount --bind /builder/ccache "$GITHUB_WORKSPACE/.ccache"
          sudo chown -R "$(id -u):$(id -g)" /builder/ccache "$GITHUB_WORKSPACE/.ccache"

      - name: Restore ccache
        uses: actions/cache@v6.1.0
        with:
          path: .ccache
          key: zerowrt-ccache-${{ runner.os }}-${{ env.ZEROWRT_DEVICE }}-${{ env.ZEROWRT_REF }}-v2

      - name: Prepare ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=5G

      - name: Download source archives
        env:
          TMPDIR: /builder/tmp
        run: |
          mkdir -p "$TMPDIR"
          python3 scripts/zerowrt.py build download --tree "$LEDE_DIR" --jobs "$(nproc)"

      - name: Compile firmware
        env:
          TMPDIR: /builder/tmp
        run: python3 scripts/zerowrt.py build compile --tree "$LEDE_DIR" --jobs "$(nproc)"

      - name: Collect artifacts
        run: python3 scripts/zerowrt.py build collect --tree "$LEDE_DIR" --out dist

      - name: Build summary
        if: success()
        run: |
          {
            echo "## ZeroWrt build"
            echo '```'
            cat dist/BUILD_INFO.txt
            echo
            ls -lh dist
            echo '```'
            echo "### SHA256"
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.ZEROWRT_DEVICE }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish device release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$ZEROWRT_DEVICE"
          # Delete by id: a release left as a draft by an interrupted run is not
          # reachable through its tag, and a leftover draft keeps the assets
          # invisible.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" |
            while read -r id; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done || true
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1 || true
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file dist/BUILD_INFO.txt

          # A draft release hides every asset from anonymous clients, so the
          # OTA download turns into a 404. Publish explicitly and verify.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          echo "release draft flag: $draft"
          if [ "$draft" != "false" ]; then
            echo "release $TAG is still a draft; OTA downloads would 404"
            exit 1
          fi

      - name: Publish OTA page
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sh "$LEDE_DIR/package/new/luci-app-ota/tools/publish_site.sh" \
            --repo "$GITHUB_REPOSITORY" \
            --dist dist \
            --meta "$GITHUB_WORKSPACE/ota-meta.json" \
            --tag "$ZEROWRT_DEVICE" \
            --branch gh-pages

      - name: Trim build logs
        if: failure()
        run: |
          mkdir -p dist
          for log in build download defconfig feeds-update feeds-install toolchain; do
            if [ -f "/builder/lede/$log.log" ]; then
              tail -n 3000 "/builder/lede/$log.log" > "dist/$log-tail.log"
            fi
          done

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.ZEROWRT_DEVICE }}-logs
          path: dist/*-tail.log
          if-no-files-found: ignore
          retention-days: 7
