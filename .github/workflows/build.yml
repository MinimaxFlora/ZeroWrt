name: Build ZeroWrt

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device profile"
        required: true
        type: choice
        default: ruijie_rg-x60-new
        options:
          - ruijie_rg-x60-new
      lan_ip:
        description: "LAN IP (management address)"
        required: true
        type: string
        default: "10.0.0.1"
      root_password:
        description: "Root password (at least 8 characters)"
        required: true
        type: string
        default: "password"
      wifi_name:
        description: "WiFi name prefix; -2.4G / -5G / -6G is appended"
        required: true
        type: string
        default: "ZeroWrt"
      wifi_password:
        description: "WiFi password: 8-63 safe characters"
        required: true
        type: string
        default: "1234567890"
      ota_url:
        description: "OTA index URL (empty = GitHub Pages for this repository)"
        required: false
        type: string
        default: ""
      ota_cname:
        description: "Optional custom domain for the OTA download page"
        required: false
        type: string
        default: ""
      cache_toolchain:
        description: "Restore the toolchain cache when available"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: zerowrt-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  BUILD_ROOT: /builder
  ZEROWRT_SOURCE_DIR: /builder/source
  ZEROWRT_DEVICE: ${{ inputs.device }}
  ZEROWRT_DIST: ZeroWrt
  TZ: Asia/Shanghai

jobs:
  build:
    name: Compile ZeroWrt
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout ZeroWrt
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Show runner
        run: |
          python3 --version
          uname -a

      - name: Prepare build space
        run: |
          python3 scripts/zerowrt.py system free-disk \
            --build-dir "$BUILD_ROOT" \
            --swap-gb 4 \
            --reserve-gb 6 \
            --min-free-gb 50

      - name: Install build dependencies
        run: python3 scripts/zerowrt.py system install-deps

      - name: Install LLVM
        run: python3 scripts/zerowrt.py system install-llvm

      - name: Clone build source
        run: |
          python3 scripts/zerowrt.py source clone \
            --dest "$ZEROWRT_SOURCE_DIR" \
            --device "$ZEROWRT_DEVICE"

      - name: Update feeds
        run: python3 scripts/zerowrt.py source feeds-update --tree "$ZEROWRT_SOURCE_DIR"

      - name: Install feeds
        run: python3 scripts/zerowrt.py source feeds-install --tree "$ZEROWRT_SOURCE_DIR"

      - name: Add external packages
        run: |
          python3 scripts/zerowrt.py packages add \
            --tree "$ZEROWRT_SOURCE_DIR"

      - name: Apply core customisations
        env:
          ZEROWRT_IP: ${{ inputs.lan_ip }}
          ZEROWRT_ROOT_PASSWORD: ${{ inputs.root_password }}
          ZEROWRT_WIFI_NAME: ${{ inputs.wifi_name }}
          ZEROWRT_WIFI_PASSWORD: ${{ inputs.wifi_password }}
        run: |
          python3 scripts/zerowrt.py source customize \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --assets "$GITHUB_WORKSPACE/assets"

      - name: Apply patches
        run: python3 scripts/zerowrt.py patches apply --tree "$ZEROWRT_SOURCE_DIR"

      - name: Apply device .config
        run: |
          python3 scripts/zerowrt.py config apply \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --device "$ZEROWRT_DEVICE"

      - name: Embed OTA metadata
        env:
          OTA_URL_INPUT: ${{ inputs.ota_url }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          if [ -n "$OTA_URL_INPUT" ]; then
            OTA_URL="$OTA_URL_INPUT"
          else
            OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            OTA_URL="https://${OWNER}.github.io/${REPO_NAME}/ota.json"
          fi
          python3 scripts/zerowrt.py ota embed \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --api-url "$OTA_URL" \
            --emit "$GITHUB_WORKSPACE/ota-meta.json"

      - name: Restore toolchain cache
        if: ${{ inputs.cache_toolchain }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/zerowrt.py cache restore \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --repo "$GITHUB_REPOSITORY"

      - name: Download source archives
        env:
          TMPDIR: /builder/tmp
        run: |
          mkdir -p "$TMPDIR"
          python3 scripts/zerowrt.py build download \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --jobs "$(nproc)"

      - name: Compile firmware
        env:
          TMPDIR: /builder/tmp
        run: |
          python3 scripts/zerowrt.py build compile \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --jobs "$(nproc)"

      - name: Collect artifacts
        run: |
          python3 scripts/zerowrt.py build collect \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --out dist

      - name: Generate OTA index
        run: |
          python3 scripts/zerowrt.py ota index \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --dist dist \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$ZEROWRT_DEVICE"

      - name: Build summary
        if: success()
        run: |
          {
            echo "## ZeroWrt build"
            echo '```'
            cat dist/BUILD_INFO.txt
            echo
            ls -lh dist
            echo '```'
            echo "### SHA256"
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.ZEROWRT_DEVICE }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish device release
        if: success()
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.ZEROWRT_DEVICE }}
          name: ${{ env.ZEROWRT_DEVICE }}
          target_commitish: ${{ github.sha }}
          body_path: dist/BUILD_INFO.txt
          files: dist/*
          draft: false
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: false

      - name: Publish OTA page
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTA_CNAME: ${{ inputs.ota_cname }}
        run: |
          python3 scripts/zerowrt.py ota publish \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --dist dist \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$ZEROWRT_DEVICE" \
            --branch gh-pages \
            --site "$ZEROWRT_SOURCE_DIR/package/new/luci-app-ota/site" \
            --cname "$OTA_CNAME"

      - name: Trim build logs
        if: failure()
        run: |
          mkdir -p dist
          for log in build download defconfig feeds-update feeds-install toolchain; do
            if [ -f "/builder/source/$log.log" ]; then
              tail -n 3000 "/builder/source/$log.log" > "dist/$log-tail.log"
            fi
          done

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.ZEROWRT_DEVICE }}-logs
          path: dist/*-tail.log
          if-no-files-found: ignore
          retention-days: 7
