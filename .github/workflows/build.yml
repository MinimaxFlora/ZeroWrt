name: Build ZeroWrt

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device profile (one image per run)"
        required: true
        type: choice
        default: netcore_n60-pro
        options:
          - netcore_n60-pro
          - ruijie_ew-6000gx-pro-expand
          - ruijie_ew-6000gx-pro
          - ruijie_ew-6000gx-pro-stock
          - ruijie_ew-6000gx-pro-ubootmod
          - ruijie_rg-x60-new-expand
          - ruijie_rg-x60-new
          - ruijie_rg-x60-new-stock
          - ruijie_rg-x60-new-ubootmod
          - supergateway_s20l
          - supergateway_s20m
          - supergateway_s20p
      lan_ip:
        description: "LAN IP; default 10.0.0.1 for every device"
        required: false
        type: string
        default: "10.0.0.1"
      root_password:
        description: "Root password (required, at least 8 characters; no default)"
        required: true
        type: string
        default: ""
      wifi_name:
        description: "WiFi name prefix; -2.4G / -5G is appended"
        required: true
        type: string
        default: "ZeroWrt"
      wifi_password:
        description: "WiFi password: 8-63 safe characters"
        required: true
        type: string
        default: "1234567890"
      ota_url:
        description: "OTA index URL (default: https://ota.tatalvpai.vip/ota.json)"
        required: false
        type: string
        default: "https://ota.tatalvpai.vip/ota.json"
      ota_cname:
        description: "Custom domain for the OTA download page"
        required: false
        type: string
        default: "ota.tatalvpai.vip"
      cache_toolchain:
        description: "Restore the toolchain cache when available"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: zerowrt-mediatek-filogic
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  BUILD_ROOT: /builder
  ZEROWRT_SOURCE_DIR: /builder/source
  ZEROWRT_DEVICE: ${{ github.event.inputs.device }}
  ZEROWRT_DIST: ZeroWrt
  TZ: Asia/Shanghai

jobs:
  build:
    name: Compile ${{ inputs.device }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout ZeroWrt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Show runner
        run: |
          python3 --version
          uname -a

      - name: Prepare build space
        run: |
          python3 scripts/zerowrt.py system free-disk \
            --build-dir "$BUILD_ROOT" \
            --swap-gb 4 \
            --reserve-gb 6 \
            --min-free-gb 50

      - name: Install build dependencies
        run: python3 scripts/zerowrt.py system install-deps

      - name: Install LLVM
        run: python3 scripts/zerowrt.py system install-llvm

      - name: Clone build source
        run: |
          python3 scripts/zerowrt.py source clone \
            --dest "$ZEROWRT_SOURCE_DIR" \
            --device "$ZEROWRT_DEVICE"

      - name: Update feeds
        run: python3 scripts/zerowrt.py source feeds-update --tree "$ZEROWRT_SOURCE_DIR"

      - name: Install feeds
        run: python3 scripts/zerowrt.py source feeds-install --tree "$ZEROWRT_SOURCE_DIR"

      - name: Add external packages
        run: python3 scripts/zerowrt.py packages add --tree "$ZEROWRT_SOURCE_DIR"

      - name: Apply core customisations
        env:
          ZEROWRT_LAN_IP: ${{ inputs.lan_ip }}
          ZEROWRT_ROOT_PASSWORD: ${{ inputs.root_password }}
          ZEROWRT_WIFI_NAME: ${{ inputs.wifi_name }}
          ZEROWRT_WIFI_PASSWORD: ${{ inputs.wifi_password }}
        run: |
          python3 scripts/zerowrt.py source customize \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --assets "$GITHUB_WORKSPACE/assets"

      - name: Apply device diffconfig
        run: |
          python3 scripts/zerowrt.py config apply \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --device "$ZEROWRT_DEVICE"

      - name: Embed OTA metadata
        env:
          OTA_URL_INPUT: ${{ inputs.ota_url }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          if [ -n "$OTA_URL_INPUT" ]; then
            OTA_URL="$OTA_URL_INPUT"
          else
            OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            OTA_URL="https://${OWNER}.github.io/${REPO_NAME}/ota.json"
          fi
          python3 scripts/zerowrt.py ota embed \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --api-url "$OTA_URL" \
            --emit "$GITHUB_WORKSPACE/ota-meta.json"

      - name: Restore toolchain cache
        if: ${{ inputs.cache_toolchain }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/zerowrt.py cache restore \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --repo "$GITHUB_REPOSITORY"

      - name: Download source archives
        env:
          TMPDIR: /builder/tmp
        run: |
          mkdir -p "$TMPDIR"
          python3 scripts/zerowrt.py build download \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --jobs "$(nproc)"

      - name: Compile firmware
        env:
          TMPDIR: /builder/tmp
        run: |
          python3 scripts/zerowrt.py build compile \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --jobs "$(nproc)"

      - name: Collect firmware only
        run: |
          python3 scripts/zerowrt.py build collect \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --out dist

      - name: Build summary
        if: success()
        run: |
          {
            echo "## ZeroWrt ${{ inputs.device }}"
            echo ""
            echo "| File | Size |"
            echo "| --- | ---: |"
            find dist -maxdepth 1 -type f -printf '| %f | %s bytes |\n' | sort
            echo ""
            echo "### SHA256"
            echo '```'
            sha256sum dist/* | sed 's#  dist/#  #'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.device }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish firmware release
        if: success()
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: mediatek_filogic
          name: mediatek_filogic
          target_commitish: ${{ github.sha }}
          body_path: docs/release-notes/mediatek_filogic.md
          files: dist/*
          draft: false
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Publish OTA page
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTA_CNAME: ${{ inputs.ota_cname }}
        run: |
          python3 scripts/zerowrt.py ota publish \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --dist dist \
            --repo "$GITHUB_REPOSITORY" \
            --tag mediatek_filogic \
            --branch gh-pages \
            --site "$ZEROWRT_SOURCE_DIR/package/new/luci-app-ota/site" \
            --cname "$OTA_CNAME"

      - name: Trim build logs
        if: failure()
        run: |
          mkdir -p dist
          for log in build download defconfig feeds-update feeds-install; do
            if [ -f "/builder/source/$log.log" ]; then
              tail -n 3000 "/builder/source/$log.log" > "dist/$log-tail.log"
            fi
          done

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.device }}-logs
          path: dist/*-tail.log
          if-no-files-found: ignore
          retention-days: 7
