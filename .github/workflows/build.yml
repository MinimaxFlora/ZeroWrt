name: Build ZeroWrt

on:
  workflow_dispatch:
    inputs:
      ip:
        description: "LAN IP (management address), e.g. 10.0.0.1"
        required: true
        type: string
        default: "10.0.0.1"
      wifi_name:
        description: "WiFi name prefix; -2.4G / -5G / -6G is appended automatically"
        required: true
        type: string
        default: "ZeroWrt"
      wifi_password:
        description: "WiFi password: 8-63 chars, letters/digits/!@#$%^&*()_+.:=?- only"
        required: true
        type: string
        default: "1234567890"
      device:
        description: "Device profile; ruijie_rg-x60-new builds the ubootmod layout, x86_64 uses LEDE"
        required: true
        type: choice
        default: "ruijie_rg-x60-new"
        options:
          - ruijie_rg-x60-new
          - x86_64

permissions:
  contents: write

concurrency:
  group: zerowrt-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  BUILD_ROOT: /builder
  ZEROWRT_SOURCE_DIR: /builder/source
  ZEROWRT_DEVICE: ${{ github.event.inputs.device || 'ruijie_rg-x60-new' }}
  OTA_BASE_URL: "https://ota.tatalvpai.vip"

jobs:
  build:
    name: Compile ZeroWrt
    # Pin the image on purpose: ubuntu-latest migrates to Ubuntu 26 in
    # October 2026 and would swap the toolchain under an unchanged build.
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout ZeroWrt
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Show runner
        run: |
          python3 --version
          uname -a

      # Fast path: large runners already have enough space, so nothing is
      # deleted or merged. Small runners are cleaned up and merged with LVM.
      - name: Prepare build space
        run: |
          python3 scripts/zerowrt.py system free-disk \
            --build-dir "$BUILD_ROOT" \
            --swap-gb 4 \
            --reserve-gb 6 \
            --min-free-gb 50

      - name: Install build dependencies
        run: python3 scripts/zerowrt.py system install-deps

      - name: Install LLVM
        run: python3 scripts/zerowrt.py system install-llvm

      # The device profile decides the tree: ImmortalWrt for the MT7986 board,
      # LEDE for x86_64. Both are public, so no repository secret is involved.
      - name: Clone build source
        run: |
          python3 scripts/zerowrt.py source clone \
            --dest "$ZEROWRT_SOURCE_DIR" \
            --device "$ZEROWRT_DEVICE"

      - name: Update feeds
        run: python3 scripts/zerowrt.py source feeds --tree "$ZEROWRT_SOURCE_DIR"

      - name: Apply core customisations
        env:
          ZEROWRT_IP: ${{ github.event.inputs.ip || '10.0.0.1' }}
          ZEROWRT_WIFI_NAME: ${{ github.event.inputs.wifi_name || 'ZeroWrt' }}
          ZEROWRT_WIFI_PASSWORD: ${{ github.event.inputs.wifi_password || '1234567890' }}
        run: |
          python3 scripts/zerowrt.py source customize \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --ip "$ZEROWRT_IP" \
            --wifi-name "$ZEROWRT_WIFI_NAME" \
            --assets "$GITHUB_WORKSPACE/assets"

      - name: Add external packages and branding
        run: |
          python3 scripts/zerowrt.py packages add \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --assets "$GITHUB_WORKSPACE/assets" \
            --device "$ZEROWRT_DEVICE"

      # Clones luci-app-ota and patches its index generator so the ubootmod
      # image is published (and preloader.bin is not).
      - name: Add luci-app-ota
        run: |
          python3 scripts/zerowrt.py packages ota --tree "$ZEROWRT_SOURCE_DIR"

      - name: Generate .config
        run: |
          python3 scripts/zerowrt.py config generate \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --device "$ZEROWRT_DEVICE"

      - name: Embed OTA metadata
        run: |
          python3 "$ZEROWRT_SOURCE_DIR/package/new/luci-app-ota/tools/embed_ota_meta.py" \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --info "$ZEROWRT_SOURCE_DIR/.zerowrt-info.json" \
            --dist-name ZeroWrt \
            --api-url "$OTA_BASE_URL/ota.json" \
            --emit "$GITHUB_WORKSPACE/ota-meta.json"

      # The cache is keyed by device as well as by arch: the two devices build
      # from different trees, so a toolchain from the other tree (or from the
      # old LEDE branch) must never be restored. The newest matching asset wins,
      # which also retires a cache built with an older GCC.
      - name: Restore toolchain cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$ZEROWRT_SOURCE_DIR"
          # A missing release or a release without a matching asset is not an
          # error yet: both cases end in the explicit message below.
          set +e
          assets=$(gh release view toolchain --repo "$GITHUB_REPOSITORY" --json assets \
            --jq ".assets[] | select(.name | startswith(\"toolchain_${ZEROWRT_DEVICE}_\")) | [.createdAt, .name] | @tsv")
          set -e
          asset=$(printf '%s\n' "$assets" | sort -r | head -n1 | cut -f2)
          if [ -z "$asset" ]; then
            echo "no toolchain cache for ${ZEROWRT_DEVICE} in the 'toolchain' release"
            echo "run the 'Build Toolchain Cache' workflow for this device first"
            exit 1
          fi
          echo "restoring $asset"
          gh release download toolchain --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" --output toolchain.tar.zst
          tar -I zstd -xf toolchain.tar.zst
          rm -f toolchain.tar.zst
          mkdir -p bin
          find ./staging_dir/ -name '*' -exec touch {} \; >/dev/null 2>&1
          find ./tmp/ -name '*' -exec touch {} \; >/dev/null 2>&1


      - name: Download source archives
        env:
          TMPDIR: /builder/tmp
        run: |
          mkdir -p "$TMPDIR"
          python3 scripts/zerowrt.py build download --tree "$ZEROWRT_SOURCE_DIR" --jobs "$(nproc)"

      - name: Compile firmware
        env:
          TMPDIR: /builder/tmp
        run: python3 scripts/zerowrt.py build compile --tree "$ZEROWRT_SOURCE_DIR" --jobs "$(nproc)"

      - name: Collect artifacts
        run: python3 scripts/zerowrt.py build collect --tree "$ZEROWRT_SOURCE_DIR" --out dist

      - name: Build summary
        if: success()
        run: |
          {
            echo "## ZeroWrt build"
            echo '```'
            cat dist/BUILD_INFO.txt
            echo
            ls -lh dist
            echo '```'
            echo "### SHA256"
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.ZEROWRT_DEVICE }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish device release
        if: success()
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.ZEROWRT_DEVICE }}
          name: ${{ env.ZEROWRT_DEVICE }}
          target_commitish: ${{ github.sha }}
          body_path: dist/BUILD_INFO.txt
          files: dist/*
          draft: false
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: false

      - name: Publish OTA page
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sh "$ZEROWRT_SOURCE_DIR/package/new/luci-app-ota/tools/publish_site.sh" \
            --repo "$GITHUB_REPOSITORY" \
            --dist dist \
            --meta "$GITHUB_WORKSPACE/ota-meta.json" \
            --tag "$ZEROWRT_DEVICE" \
            --branch gh-pages

      # Mirror the published gh-pages content to Cloudflare Pages, which serves
      # https://ota.tatalvpai.vip with its own certificate.
      - name: Deploy OTA page to Cloudflare Pages
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rm -rf /tmp/ota-site
          git clone --quiet --depth 1 --branch gh-pages \
            "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/ota-site
          npx --yes wrangler@4 pages deploy /tmp/ota-site \
            --project-name=zerowrt-ota \
            --branch=gh-pages \
            --commit-dirty=true

      - name: Trim build logs
        if: failure()
        run: |
          mkdir -p dist
          for log in build download defconfig feeds-update feeds-install toolchain; do
            if [ -f "/builder/source/$log.log" ]; then
              tail -n 3000 "/builder/source/$log.log" > "dist/$log-tail.log"
            fi
          done

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.ZEROWRT_DEVICE }}-logs
          path: dist/*-tail.log
          if-no-files-found: ignore
          retention-days: 7
