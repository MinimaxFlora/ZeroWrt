name: Deploy OTA page

# Manual redeploy of the published gh-pages content to Cloudflare Pages.
# The firmware build also does this after publishing, but this workflow lets
# us refresh https://ota.tatalvpai.vip without waiting for a full build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v7.0.1
        with:
          ref: gh-pages

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy . \
            --project-name=zerowrt-ota \
            --branch=gh-pages \
            --commit-dirty=true
