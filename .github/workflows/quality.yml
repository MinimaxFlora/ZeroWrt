name: Code quality

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/quality.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/quality.yml"

permissions:
  contents: read

jobs:
  quality:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tools
        run: python -m pip install --disable-pip-version-check ruff pillow

      - name: Ruff
        run: |
          ruff check scripts tests
          ruff format --check scripts tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v
