name: Switch OTA Pages to main

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  switch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Switch production branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -fsS -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/zerowrt-ota" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"production_branch":"main"}' | tee /tmp/cf-project.json
          jq -e '.success == true' /tmp/cf-project.json

      - name: Download current OTA site
        run: |
          mkdir -p site/assets
          base=https://ota.tatalvpai.vip
          curl -fsSL "$base/" -o site/index.html
          curl -fsSL "$base/ota.json" -o site/ota.json
          curl -fsSL "$base/history.json" -o site/history.json
          for file in app.js style.css logo.png; do
            curl -fsSL "$base/assets/$file" -o "site/assets/$file"
          done
          printf 'ota.tatalvpai.vip\n' > site/CNAME
          : > site/.nojekyll

      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.158.0 pages deploy site \
            --project-name=zerowrt-ota \
            --branch=main \
            --commit-dirty=true

      - name: Verify live
        run: |
          curl -fsSL https://ota.tatalvpai.vip/ota.json \
            | jq -e '.devices["ruijie_rg-x60-new"].version == "20261109"'
