name: Build Toolchain Cache

# Compiles the cross toolchain once and publishes it as a compressed archive in
# the "toolchain" release (release title: Toolchain_Cache).  Build ZeroWrt
# restores it with `cache restore` and skips the toolchain compile.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zerowrt-toolchain
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  BUILD_ROOT: /builder
  ZEROWRT_SOURCE_DIR: /builder/source
  ZEROWRT_DEVICE: netcore_n60-pro
  ZEROWRT_DIST: ZeroWrt
  TZ: Asia/Shanghai

jobs:
  toolchain:
    name: Build and publish the toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout ZeroWrt
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Prepare build space
        run: |
          python3 scripts/zerowrt.py system free-disk \
            --build-dir "$BUILD_ROOT" \
            --swap-gb 4 \
            --reserve-gb 6 \
            --min-free-gb 50

      - name: Install build dependencies
        run: python3 scripts/zerowrt.py system install-deps

      - name: Install LLVM
        run: python3 scripts/zerowrt.py system install-llvm

      - name: Clone build source
        run: |
          python3 scripts/zerowrt.py source clone \
            --dest "$ZEROWRT_SOURCE_DIR" \
            --device "$ZEROWRT_DEVICE"

      - name: Update feeds
        run: python3 scripts/zerowrt.py source feeds-update --tree "$ZEROWRT_SOURCE_DIR"

      - name: Install feeds
        run: python3 scripts/zerowrt.py source feeds-install --tree "$ZEROWRT_SOURCE_DIR"

      - name: Add external packages
        run: python3 scripts/zerowrt.py packages add --tree "$ZEROWRT_SOURCE_DIR"

      - name: Apply device .config
        run: |
          python3 scripts/zerowrt.py config apply \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --device "$ZEROWRT_DEVICE"

      - name: Build toolchain
        env:
          TMPDIR: /builder/tmp
        run: |
          mkdir -p "$TMPDIR"
          cd "$ZEROWRT_SOURCE_DIR"
          make -j"$(nproc)" toolchain/compile || make -j1 toolchain/compile V=s

      - name: Publish toolchain cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/zerowrt.py cache save \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --repo "$GITHUB_REPOSITORY"
