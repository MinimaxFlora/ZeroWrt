[project]
name = "zerowrt-builder"
version = "3.0.0"
description = "Python build pipeline for ZeroWrt on MediaTek Filogic (MT7986)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }

[project.optional-dependencies]
dev = ["ruff", "coverage", "mypy"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["zerowrt_core"]
